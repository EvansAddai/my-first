<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="css/Project.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="icon" href="assets/logo.jpg" type="image/x-icon" />
  </head>
  <body>
    <main class="login-page">
      <form id="login-form" action="" class="login-container">
        <div class="login-brand">
          <img src="assets/logo.jpg" alt="AESA logo" />
          <div>
            <h2>Welcome Back</h2>
            <p>Sign in to continue exploring AESA Automobiles.</p>
          </div>
        </div>


        <div class="login-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="login-field password-field">
          <label for="password">Password</label>
          <div class="password-input">
            <input type="password" id="password" name="password" required />
            <button
              type="button"
              class="toggle-password"
              aria-label="Show password"
            >
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn4">Login</button>
        <p class="message"></p>
        <br />
        <p class="form-note">
          Don't have an account? <a href="register.html">Register here</a>
        </p>

        <div class="socials">
          <p>Or login with</p>
          <a href="#" aria-label="Facebook"
            ><i class="fab fa-facebook-f"></i
          ></a>
          <a href="#" aria-label="Google"><i class="fab fa-google"></i></a>
          <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
          <a href="#" aria-label="LinkedIn"
            ><i class="fab fa-linkedin-in"></i
          ></a>
          <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
        </div>
      </form>
    </main>
    <script src="js/loader.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
